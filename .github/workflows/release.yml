name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One VSIX per platform, each carrying the codediff binary for that platform. The version comes
  # from `codediffVersion` in package.json - a pinned tag, never `latest`, so a rebuild of the same
  # extension tag produces the same package.
  #
  # The bundle exists mainly for one failure it removes: a VS Code launched from Finder or the Dock
  # does not inherit a login shell's PATH, so a codediff installed to ~/.cargo/bin is invisible to
  # it and the extension reports a missing binary the user can plainly run in a terminal.
  platform:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are VS Code's target names, not Rust triples - the two namespaces are unrelated.
        # scripts/fetch-binary.mjs holds the mapping between them, and a test asserts this list and
        # that table agree.
        #
        # `alpine-x64` is deliberately absent: VS Code Remote containers are often Alpine, and a
        # linux-x64 VSIX carries a glibc binary that dies on musl with an unreadable loader error.
        # Publishing nothing for it makes the Marketplace serve the fallback VSIX below instead.
        target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 because @vscode/vsce declares `engines: node >= 22`; see the note in ci.yml.
          node-version: 22
          cache: npm
      - run: npm ci

      # Verifies the download against the codediff release's own SHA256SUMS.txt, which that
      # repository's release workflow publishes for consumers like this one.
      - name: Fetch the pinned codediff binary
        run: npm run fetch-binary -- ${{ matrix.target }}

      - run: npx --yes @vscode/vsce package --target ${{ matrix.target }} --out codediff-${{ matrix.target }}.vsix

      # Read the mode out of the packaged archive rather than trusting that it survived. A VSIX is
      # a ZIP, and ZIP carries Unix mode bits only if the writer sets them; if vsce drops them the
      # binary lands without +x and fails at spawn with EACCES on the user's machine, long after
      # this run was green. The extension chmods what it finds as well, but that masks a broken
      # package rather than proving a good one - which is why this check is here too.
      - name: Bundled binary is executable inside the VSIX
        if: matrix.target != 'win32-x64'
        run: |
          unzip -Z codediff-${{ matrix.target }}.vsix extension/bin/codediff
          unzip -Z codediff-${{ matrix.target }}.vsix extension/bin/codediff | grep -qE '^-.{2}x' \
            || { echo "::error::bundled binary is not executable inside the VSIX"; exit 1; }

      - name: Bundled binary is present (Windows)
        if: matrix.target == 'win32-x64'
        run: unzip -Z1 codediff-win32-x64.vsix | grep -qx 'extension/bin/codediff.exe'

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: codediff-${{ matrix.target }}.vsix

  # The target-less VSIX, for every architecture with no build of its own - arm64 Windows, Alpine,
  # anything new. It carries no binary and falls through to PATH, which is how the extension
  # behaved everywhere before bundling existed.
  fallback:
    name: fallback (no binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 because @vscode/vsce declares `engines: node >= 22`; see the note in ci.yml.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes @vscode/vsce package --out codediff-fallback.vsix
      - name: Carries no binary
        run: |
          if unzip -Z1 codediff-fallback.vsix | grep -q '^extension/bin/'; then
            echo "::error::the fallback VSIX contains a bundled binary"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-fallback
          path: codediff-fallback.vsix

  # Attaches every VSIX to the GitHub release. Publishing to the Marketplace or Open VSX is a
  # separate, deliberate step and is not automated here - it needs credentials this repository does
  # not hold. See CONTRIBUTING.md.
  release:
    name: attach to release
    runs-on: ubuntu-latest
    needs: [platform, fallback]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

  # Publishing is two jobs, not one, and neither depends on the other. A Marketplace publish that
  # succeeds followed by an Open VSX publish that fails would, in a single job, leave the re-run
  # dead on "version already exists" - and a version can never be republished. Split, the re-run
  # touches only the registry that actually failed.
  #
  # Both publish the VSIXs the jobs above built rather than repackaging: the execute-bit check and
  # the no-binary-in-the-fallback check ran on those exact files, so those are the files that
  # should reach users.
  publish-marketplace:
    name: publish to the VS Marketplace
    runs-on: ubuntu-latest
    needs: [platform, fallback]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/setup-node@v4
        with:
          # 22 because @vscode/vsce declares `engines: node >= 22`; see the note in ci.yml.
          node-version: 22

      # An unset secret is an empty string, not an error, and `vsce publish` with an empty PAT
      # fails somewhere inside an HTTP 401 that reads like an outage. Say which secret is missing,
      # before anything is attempted.
      - name: VSCE_PAT is set
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set. Add an Azure DevOps personal access token"
            echo "::error::(Organization: all accessible, Scopes: Marketplace -> Manage) as a"
            echo "::error::repository secret named VSCE_PAT. See CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true

      # One invocation for all six. vsce takes repeated --packagePath precisely so that a
      # platform-specific extension's builds land as one version rather than six racing ones.
      - name: vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          args=""
          for vsix in *.vsix; do
            args="$args --packagePath $vsix"
          done
          echo "publishing:$args"
          npx --yes @vscode/vsce publish $args

  # Open VSX is what VSCodium, Cursor, Windsurf and the other non-Microsoft builds install from.
  # Skipping it would cut out a real share of users for one more job.
  publish-openvsx:
    name: publish to Open VSX
    runs-on: ubuntu-latest
    needs: [platform, fallback]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OVSX_PAT is set
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not set. Create an Eclipse Foundation account, sign the"
            echo "::error::publisher agreement, generate a token at https://open-vsx.org/user-settings/tokens"
            echo "::error::and add it as a repository secret named OVSX_PAT. See CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true

      # Idempotent on purpose: the namespace has to exist before the first publish and must not
      # break every release after it. `create-namespace` fails with a 4xx once it is there, which
      # is the expected outcome on all but the first run.
      - name: Ensure the namespace exists
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx create-namespace ivankovic -p "$OVSX_PAT" || echo "namespace already exists"

      # A loop rather than one command: `ovsx publish` takes a single package, and a per-file loop
      # also names which target failed.
      - name: ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for vsix in *.vsix; do
            echo "=== $vsix ==="
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          done
