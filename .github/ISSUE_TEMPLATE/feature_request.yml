name: Feature request
description: Something the extension should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: The task you are trying to accomplish, not only the feature you have in mind for it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, if there is one, and where it falls short.
